{% extends 'base.html' %}
{% block title_tag %}{{ game.team_a_name }} vs {{ game.team_b_name }} — Scoredboard{% endblock %}
{% block body %}
<div class="board-page">
    <p class="board-code">{{ game.code }}</p>
    <div class="scoreboard">
        <div class="team-block">
            <span class="team-name">{{ game.team_a_name }}</span>
            <span id="team_a_score" class="team-score">{{ game.team_a_score }}</span>
        </div>
        <div class="team-block">
            <span class="team-name">{{ game.team_b_name }}</span>
            <span id="team_b_score" class="team-score">{{ game.team_b_score }}</span>
        </div>
    </div>
</div>

<script>
    const scoreUrl = "{% url 'game_score' code %}";
    setInterval(() => {
        fetch(scoreUrl)
            .then(r => r.json())
            .then(data => {
                document.getElementById('team_a_score').textContent = data.team_a_score;
                document.getElementById('team_b_score').textContent = data.team_b_score;
            });
    }, 2000);
</script>
{% endblock %}
