{% extends 'base.html' %}
{% block title_tag %}Control — {{ code }}{% endblock %}
{% block body %}
<div class="card">
    <div style="display:flex;flex-direction:column;gap:1rem;">
        <h1>Score Control</h1>
        <p class="subtitle">Game {{ code }}</p>
    </div>
    <form method="post" action="">
        {% csrf_token %}
        <div style="display:flex;flex-direction:column;gap:1rem;">
            <div class="field">
                <label for="{{ form.team_a_score.id_for_label }}">{{ game.team_a_name }}</label>
                {{ form.team_a_score }}
            </div>
            <div class="field">
                <label for="{{ form.team_b_score.id_for_label }}">{{ game.team_b_name }}</label>
                {{ form.team_b_score }}
            </div>
            <button type="submit" class="btn btn-primary" style="margin-top:0.5rem;">Update Score</button>
        </div>
    </form>
</div>
{% endblock %}
