{% extends 'base.html' %}
{% block title_tag %}Game Created — Scoredboard{% endblock %}
{% block body %}
<div class="card">
    <div>
        <h1>Game Created</h1>
        <p class="subtitle">Share the links below with your players.</p>
    </div>
    <p class="game-code">{{ game.code }}</p>
    <p class="game-code-label">Game code</p>
    <div class="action-links">
        <a href="{% url 'game_display' game.code %}" target="_blank" class="btn btn-primary">Open Display Board</a>
        <a href="{% url 'game_control' game.code %}" target="_blank" class="btn">Open Score Control</a>
    </div>
</div>
{% endblock %}
